name: Multilingual static validation

on:
  push:
    branches: [multilingual-expansion]
  pull_request:
    branches: [multilingual-expansion]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sitemap XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml is well-formed')"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate multilingual pages
        run: node scripts/validate-multilingual.js
